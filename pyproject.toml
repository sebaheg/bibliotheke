[project]
name = "bibliotheke"
version = "0.1.0"
description = "A lightweight, general-purpose knowledge graph framework: no server, no database, just human-readable YAML/Markdown files in your repo, versioned with git"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "networkx>=3.3",
    "plotui[textual]>=0.6.0",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
# `bib fetch`: yt-dlp reads YouTube metadata and captions, PyMuPDF reads the
# text of arXiv PDFs that have no HTML rendering. Whisper is left to the user
# (mlx-whisper on Apple silicon, or faster-whisper) for --transcribe whisper.
fetch = ["yt-dlp>=2025.1.1", "pymupdf>=1.24"]

[project.scripts]
bibliotheke = "bibliotheke.cli:main"
bib = "bibliotheke.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"

# plotui features bibliotheke uses (globe, legend toggles, graph styles) are not
# released yet; build from the sibling checkout until plotui 0.7 is on PyPI.
[tool.uv.sources]
plotui = { path = "../plotui" }
